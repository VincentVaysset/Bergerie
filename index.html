<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2f6b43">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Bergerie">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<title>Ma bergerie — Lots &amp; rations</title>
<style>
  :root{
    --vert:#2f6b43;--vertf:#e6f0e8;--fond:#f7f4ec;--carte:#ffffff;--encre:#211e1a;--muet:#7b7368;--ligne:#e4ddcd;--doux:#f3eee3;
    --ok:#2f7d4a;--okf:#e3f1e7;--att:#c77a12;--attf:#fbefd9;--hors:#c0392f;--horsf:#f9e3e0;--vide:#9a9187;--videf:#efebe4;
    --nav:64px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--fond);color:var(--encre);display:flex;flex-direction:column;height:100dvh;overflow:hidden;-webkit-tap-highlight-color:transparent;font-size:16px}
  button{font:inherit;border:none;border-radius:12px;cursor:pointer;background:none;color:inherit;padding:0}
  input{font:inherit;color:var(--encre)}
  svg.i{flex-shrink:0}
  .num{font-variant-numeric:tabular-nums}

  /* en-tête */
  header{background:var(--vert);color:#fff;flex-shrink:0;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;display:flex;align-items:center;gap:12px}
  header h1{margin:0;font-size:19px;font-weight:700;flex:1;letter-spacing:.2px}
  .pill{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:7px 13px;font-size:14px;font-weight:600;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);color:#fff}
  .pill.regler{background:#fff;color:var(--att);border-color:#fff}

  /* vues */
  main{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch}
  .vue{display:none;padding:14px 16px 28px;max-width:760px;margin:0 auto}
  .vue.on{display:block}
  #v-plan{padding:0;max-width:none}
  h2{font-size:13px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--muet);margin:22px 0 8px}
  h2:first-child{margin-top:4px}

  /* barre d'onglets */
  nav{flex-shrink:0;display:flex;background:var(--carte);border-top:1px solid var(--ligne);padding-bottom:env(safe-area-inset-bottom)}
  nav button{flex:1;height:var(--nav);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--muet);font-size:12px;font-weight:600;border-radius:0;position:relative}
  nav button.on{color:var(--vert)}
  nav button.on::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;border-radius:0 0 3px 3px;background:var(--vert)}
  nav .alerte{position:absolute;top:9px;left:calc(50% + 8px);width:10px;height:10px;border-radius:50%;border:2px solid var(--carte)}

  /* cartes */
  .carte{background:var(--carte);border:1px solid var(--ligne);border-radius:16px;padding:14px 16px;margin:10px 0}
  .ligne{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .sp{flex:1}
  .muet{color:var(--muet)}
  .petit{font-size:13.5px}
  .gros{font-size:30px;font-weight:800;line-height:1.05}
  .moyen{font-size:20px;font-weight:700}
  .dot{width:14px;height:14px;border-radius:5px;display:inline-block;flex-shrink:0}
  .nom{font-weight:700;font-size:17px}
  .sep{border-top:1px solid var(--ligne);margin:12px 0}
  .hint{font-size:13.5px;color:var(--muet);line-height:1.5;margin:10px 2px}

  /* boutons */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:12px;font-weight:600;background:var(--doux);color:var(--encre)}
  .btn.prim{background:var(--vert);color:#fff}
  .btn.danger{background:var(--horsf);color:var(--hors)}
  .btn.plein{width:100%}
  .btn.mini{min-height:38px;padding:0 12px;font-size:14px}
  .ico{width:42px;height:42px;display:inline-flex;align-items:center;justify-content:center;border-radius:12px;background:var(--doux);color:#4a443d}
  .ico.danger{background:var(--horsf);color:var(--hors)}
  .seg{display:inline-flex;background:var(--doux);border-radius:12px;padding:3px}
  .seg button{min-height:38px;padding:0 14px;border-radius:10px;font-weight:600;color:var(--muet);font-size:14.5px}
  .seg button.on{background:var(--carte);color:var(--encre);box-shadow:0 1px 3px rgba(0,0,0,.1)}

  /* saisies */
  .champ{width:92px;height:46px;border:1.5px solid var(--ligne);border-radius:12px;text-align:center;font-size:20px;font-weight:700;background:#fff}
  .champ:focus{outline:none;border-color:var(--vert)}
  .champ.txt{width:auto;flex:1;min-width:140px;text-align:left;padding:0 12px;font-size:17px;font-weight:600}
  .pas{display:inline-flex;align-items:center;gap:6px}
  .pas button{width:46px;height:46px;border-radius:12px;background:var(--doux);font-size:24px;font-weight:600;display:flex;align-items:center;justify-content:center}

  /* repères */
  .badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 11px;font-size:14px;font-weight:700;white-space:nowrap}
  .n-ok{background:var(--okf);color:var(--ok)}
  .n-attention{background:var(--attf);color:var(--att)}
  .n-hors{background:var(--horsf);color:var(--hors)}
  .n-vide{background:var(--videf);color:var(--vide)}
  .barre{border-left:6px solid var(--vide)}
  .barre.n-ok-b{border-left-color:var(--ok)} .barre.n-attention-b{border-left-color:var(--att)} .barre.n-hors-b{border-left-color:var(--hors)}
  .tag{display:inline-block;border:1px solid var(--ligne);border-radius:8px;padding:2px 8px;font-size:13px;color:#5f584f;background:#faf8f3}

  /* bannières */
  .banniere{border-radius:16px;padding:14px 16px;margin:4px 0 10px;display:flex;gap:12px;align-items:flex-start}
  .banniere b{display:block;font-size:18px;margin-bottom:2px}
  .note{background:var(--doux);border-radius:12px;padding:10px 12px;font-size:14px;margin:8px 0;display:flex;gap:9px;align-items:flex-start;color:#4a443d;line-height:1.45}
  .note.ko{background:var(--horsf);color:#8f2a22}

  /* trémies */
  .plage{padding:10px 0;border-top:1px solid var(--doux)}
  .plage:first-of-type{border-top:none}
  .dose{display:flex;align-items:center;gap:10px;padding:7px 0}
  .dose .fn{flex:1;display:flex;align-items:center;gap:8px;font-size:15.5px}
  .dose .val{font-size:24px;font-weight:800;text-align:right;min-width:96px}
  .dose .val small{font-size:13px;font-weight:600;color:var(--muet);margin-left:2px}
  .dose button.val{border-bottom:2px dashed var(--ligne);border-radius:0;padding:0 0 1px}
  .ecart{font-size:13px;color:var(--att);font-weight:600;margin:-2px 0 6px 22px}

  /* plan */
  #planWrap{display:flex;flex-direction:column}
  #mapWrap{position:relative;width:100%;aspect-ratio:35.8/23.2;max-height:62dvh;background:#ebe4d3;flex-shrink:0}
  #map{width:100%;height:100%;display:block;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  .zooms{position:absolute;right:6px;top:6px;display:flex;flex-direction:column;gap:5px}
  .zooms button{width:36px;height:36px;opacity:.92;background:#fff;border:1px solid var(--ligne);display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.12)}
  #planBas{padding:6px 16px 28px;max-width:760px;width:100%;margin:0 auto}
  .lotc{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .lotc .info{flex:1;min-width:150px}
  .chip{border-radius:999px;padding:9px 15px;border:2px solid transparent;font-weight:600;background:var(--doux);font-size:15px}
  .chip.on{border-color:var(--encre)}

  /* éditeur du plan */
  .bande{border-left:6px solid var(--ligne)}
  .bande.t-aire{border-left-color:#e0cfa6}.bande.t-double,.bande.t-simple{border-left-color:#8fb88a}.bande.t-couloir{border-left-color:#b9cdb6}
  .bande .champs{display:flex;flex-wrap:wrap;gap:10px 14px;margin-top:8px}
  .bande label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muet);font-weight:600}
  .bande .champ{width:96px;height:42px;font-size:17px}
  #geoApercu{width:100%;display:block;background:#ebe4d3;border-radius:12px}
  .erreur{color:var(--hors);font-size:14px;font-weight:600;margin:4px 0;display:flex;gap:8px;align-items:flex-start}
  /* fiche de réglage */
  .fiche{max-width:820px;margin:0 auto}
  .fiche .titre{background:var(--vert);color:#fff;border-radius:16px;padding:16px 18px;margin:6px 0 12px}
  .fiche .titre b{display:block;font-size:22px;margin-bottom:4px}
  .fiche h3{font-size:17px;margin:20px 0 8px;padding-left:10px;border-left:5px solid var(--att)}
  .etape{display:flex;gap:12px;align-items:flex-start;padding:9px 0}
  .etape .n{width:32px;height:32px;border-radius:50%;background:var(--att);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:16px}
  .etape div{line-height:1.45}
  .flux{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:10px 0}
  .flux .bx{border-radius:12px;padding:10px 12px;text-align:center;min-width:110px;flex:1}
  .flux .bx b{display:block;font-size:22px}
  .flux .op{font-weight:800;color:var(--muet);font-size:15px;white-space:nowrap}
  .bx.b1{background:#e8eef8;color:#2b4c7e}.bx.b2{background:var(--attf);color:#8a5408}.bx.b3{background:var(--okf);color:var(--ok)}
  table.ft{width:100%;border-collapse:collapse;font-size:14.5px;margin:6px 0}
  table.ft th{text-align:left;font-size:12px;letter-spacing:.5px;text-transform:uppercase;color:var(--muet);padding:6px 6px;border-bottom:2px solid var(--ligne)}
  table.ft td{padding:8px 6px;border-bottom:1px solid var(--doux);vertical-align:middle}
  table.ft td.pes{font-size:20px;font-weight:800;color:var(--ok);white-space:nowrap}
  table.ft tr.pl td{background:var(--doux);font-weight:700;font-size:14px}
  .tapisT{display:flex;align-items:center;gap:8px;background:#e9f0e6;border-radius:10px;padding:8px 12px;font-weight:700;margin-top:14px}
  @media print{
    @page{size:A4;margin:12mm}
    html,body{height:auto;overflow:visible;display:block;background:#fff}
    header,nav,.noprint{display:none!important}
    main{overflow:visible}
    .vue{display:none!important}
    #v-fiche{display:block!important;padding:0;max-width:none}
    *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
    .carte,.tapisT,table.ft tr,.etape,.flux{break-inside:avoid}
    .tapisT,.fiche h3{break-after:avoid}
    .fiche .titre{margin-top:0}
  }
  @media(min-width:980px){
    #v-plan.on{display:flex;height:100%}
    #planWrap{flex-direction:row;height:100%;width:100%}
    #mapWrap{aspect-ratio:auto;max-height:none;height:100%;flex:1}
    #planBas{width:430px;flex-shrink:0;overflow:auto;border-left:1px solid var(--ligne);background:var(--fond)}
  }
</style>
</head>
<body>
<header>
  <h1>Ma bergerie</h1>
  <button class="pill" id="pill"></button>
</header>
<main>
  <section class="vue" id="v-plan">
    <div id="planWrap">
      <div id="mapWrap">
        <svg id="map" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" aria-label="Plan de la bergerie"></svg>
        <div class="zooms">
          <button id="zin" aria-label="Zoomer"></button>
          <button id="zout" aria-label="Dézoomer"></button>
          <button id="zfit" aria-label="Vue complète"></button>
        </div>
      </div>
      <div id="planBas"></div>
    </div>
  </section>
  <section class="vue" id="v-rations"></section>
  <section class="vue" id="v-tremies"></section>
  <section class="vue" id="v-controle"></section>
  <section class="vue" id="v-reglages"></section>
  <section class="vue" id="v-fiche"></section>
  <section class="vue" id="v-geo"></section>
</main>
<nav id="nav"></nav>

<script src="modele.js?v=13"></script>
<script src="stockage.js?v=13"></script>
<script>
'use strict';
var M=window.Bergerie,S=window.Stockage;
/* géométrie : celle de l'état (state.geo), dépliée par le modèle */
var L=35,W=22;
function GI(){return M.G(state);}
function syncGeo(){var g=GI();L=g.L;W=g.W;}
function X(col){return col/GI().plm;}
function nomTapis(t){return GI().tapis[t].nom||('Tapis '+(t+1));}
function nomAire(i){return GI().aires[i].nom||('Aire '+(i+1));}
var LOT_COLS=['#a8d5b0','#f5cfa0','#a9cbe8','#f2b8cf','#e8e0a0','#c9b8e8','#9fd9c8','#f0b9a0'];
var FEED_COLS=['#6a994e','#d9a441','#7b6cbf','#4d8fd1','#c96a5b','#3ba99c','#b5853f','#8a8f5a'];
var NIV={ok:'correct',attention:'à surveiller',hors:'hors norme',vide:'—'};

/* ============ icônes (traits fins) ============ */
var ICONS={
  plan:'<rect x="3" y="3" width="18" height="18" rx="2.5"/><path d="M3 9.5h18M3 15h18M12 15v6"/>',
  ration:'<path d="M4 11h16a8 8 0 0 1-16 0z"/><path d="M8 7c0-1.5 1-2 1-3.5M12 7c0-1.5 1-2 1-3.5M16 7c0-1.5 1-2 1-3.5"/>',
  hopper:'<path d="M4.5 4.5h15l-5.5 7v4.5l-4 3v-7.5z"/>',
  ctrl:'<path d="M12 3l7.5 3v5.5c0 4.5-3.2 8-7.5 9.5-4.3-1.5-7.5-5-7.5-9.5V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/>',
  lock:'<rect x="5" y="10.5" width="14" height="10" rx="2"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/>',
  unlock:'<rect x="5" y="10.5" width="14" height="10" rx="2"/><path d="M8 10.5V7.5a4 4 0 0 1 7.7-1.5"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  pen:'<path d="M13.5 20.5h7"/><path d="M16.4 3.9a2 2 0 0 1 2.8 2.8L7.5 18.4l-3.9 1 1-3.9z"/>',
  trash:'<path d="M3.5 6.5h17M8.5 6.5v-2h7v2M18.5 6.5l-1 14h-11l-1-14M10 11v5.5M14 11v5.5"/>',
  warn:'<path d="M12 3.5L2.5 19.5a1.5 1.5 0 0 0 1.3 2.3h16.4a1.5 1.5 0 0 0 1.3-2.3L12 3.5z"/><path d="M12 10v4M12 17.5h.01"/>',
  info:'<circle cx="12" cy="12" r="9"/><path d="M12 8h.01M12 11.5V16"/>',
  check:'<path d="M20 6.5L9.5 17.5 4 12"/>',
  close:'<path d="M17.5 6.5l-11 11M6.5 6.5l11 11"/>',
  dl:'<path d="M12 3.5v11M7.5 10.5L12 15l4.5-4.5"/><path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/>',
  ul:'<path d="M12 15.5v-11M7.5 8.5L12 4l4.5 4.5"/><path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/>',
  reset:'<path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1L3.5 8.5"/><path d="M3.5 3.5v5h5"/>',
  zin:'<circle cx="11" cy="11" r="7.5"/><path d="M21 21l-4.4-4.4M11 8v6M8 11h6"/>',
  zout:'<circle cx="11" cy="11" r="7.5"/><path d="M21 21l-4.4-4.4M8 11h6"/>',
  fit:'<path d="M8.5 3.5h-5v5M15.5 3.5h5v5M8.5 20.5h-5v-5M15.5 20.5h5v-5"/>',
  copy:'<rect x="8" y="8" width="12.5" height="12.5" rx="2"/><path d="M16 8V5.5a2 2 0 0 0-2-2H5.5a2 2 0 0 0-2 2V14a2 2 0 0 0 2 2H8"/>',
  left:'<path d="M14.5 6l-6 6 6 6"/>', right:'<path d="M9.5 6l6 6-6 6"/>'
};
function ic(n,s){s=s||18;return '<svg class="i" viewBox="0 0 24 24" width="'+s+'" height="'+s+'" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+ICONS[n]+'</svg>';}

/* ============ état ============ */
var storageKo=false,notice='',noticeKo=false;
var boot=S.charger();
var state=boot.state||M.defaultState();
M.normalize(state);
function save(){storageKo=!S.enregistrer(state);}
var vue='plan',sel=null,arm=null,editName=null,editFeed=null,editDose=null,showUnique=false;
try{var vv=localStorage.getItem('bergerie_vue');if(vv&&/^(plan|rations|tremies|controle|reglages)$/.test(vv))vue=vv;}catch(e){}
if(boot.source==='v5'||boot.source==='v3'){
  notice='Données reprises de l’ancienne version. Les trémies sont figées sur les doses qu’elle affichait : vérifie l’onglet Trémies.';
}

/* ============ utilitaires ============ */
function $(id){return document.getElementById(id);}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function fmt(n,d){if(d==null)d=1;return (+(n.toFixed(d))).toFixed(d).replace('.',',');}
function gr(kg){return Math.round(kg*1000);}
function pnum(v){var x=parseFloat(String(v).replace(',','.').replace(/\s/g,''));return isNaN(x)?0:x;}
function pct(p){if(p==null)return '';var r=Math.round(p*10)/10;return (r>0?'+':(r<0?'−':''))+fmt(Math.abs(r),1).replace(',0','')+' %';}
function lotById(id){return M.lotById(state,id);}
function lotStats(id){return M.lotStats(state,id);}
function lotCol(id){return LOT_COLS[id%LOT_COLS.length];}
function feedCol(id){return FEED_COLS[id%FEED_COLS.length];}
function lotName(l){return l?(l.name?l.name:'Lot '+(l.id+1)):'—';}
function lotShort(l){return l?(l.name?l.name.slice(0,16):'Lot '+(l.id+1)):'—';}
function dateFr(iso){var d=new Date(iso);return ('0'+d.getDate()).slice(-2)+'/'+('0'+(d.getMonth()+1)).slice(-2)+' à '+d.getHours()+'h'+('0'+d.getMinutes()).slice(-2);}
function badge(b){
  if(b.niveau==='vide')return '<span class="badge n-vide">'+(b.b>0?'pas de place':'pas de brebis')+'</span>';
  var t=NIV[b.niveau]+(b.pct!=null&&b.niveau!=='ok'?' · '+(b.sens==='+'?'trop':'pas assez'):'');
  return '<span class="badge n-'+b.niveau+'">'+(b.niveau==='ok'?ic('check',14):(b.niveau==='hors'?ic('warn',14):''))+(b.pct!=null?pct(b.pct)+' · ':'')+t+'</span>';
}
function causeHtml(b){
  if(!b.cause)return '';
  var f=state.feeds.find(function(x){return x.id===b.cause.fid;});
  return '<div class="petit" style="color:var(--'+(b.niveau==='hors'?'hors':'att')+');margin-top:6px;font-weight:600">à cause de : '+esc(f?f.name:'')+' '+pct(b.cause.pct)+'</div>';
}
function margesHtml(){
  var t=state.tol;
  return '<div class="ligne"><span class="badge n-ok">vert</span><span class="sp petit">écart de moins de</span><input class="champ num" id="tolV" data-act="tol" inputmode="decimal" value="'+String(t.vert).replace('.',',')+'" style="width:76px"><span>%</span></div>'+
    '<div class="ligne" style="margin-top:8px"><span class="badge n-attention">orange</span><span class="sp petit">écart de moins de</span><input class="champ num" id="tolO" data-act="tol" inputmode="decimal" value="'+String(t.orange).replace('.',',')+'" style="width:76px"><span>%</span></div>'+
    '<div class="muet petit" style="margin-top:6px">Au-delà : rouge, hors norme.</div>'+
    '<div class="ligne" style="margin-top:10px"><span class="sp petit">Compter aussi chaque aliment séparément</span><span class="seg"><button data-act="parAli" data-v="1" class="'+(t.parAliment!==false?'on':'')+'">Oui</button><button data-act="parAli" data-v="0" class="'+(t.parAliment===false?'on':'')+'">Non</button></span></div>'+
    '<div class="muet petit" style="margin-top:4px">Oui : un aliment hors marge suffit à alerter, même si le total tombe juste. Non : seul le total compte.</div>';
}
function noticeHtml(){

/* fond du plan d'après une géométrie : bandes, aires, tapis (règle graduée), couloirs */
function planFond(geo){
  var g=M.geoInfo(geo),o=[],Lg=g.L,pm=g.plm;
  o.push('<rect x="0" y="0" width="'+Lg+'" height="'+g.W+'" fill="#ebe4d3"/>');
  geo.bandes.forEach(function(b,ix){
    var y=0;for(var q=0;q<ix;q++)y+=geo.bandes[q].h;
    if(b.type==='couloir'){o.push('<rect x="0" y="'+y+'" width="'+Lg+'" height="'+b.h+'" fill="#e7efe4" stroke="#b9cdb6" stroke-width="0.06"/>');return;}
    if(b.type==='aire'){o.push('<rect x="'+(b.c0/pm)+'" y="'+y+'" width="'+(b.len/pm)+'" height="'+b.h+'" fill="#f6efdd" stroke="#cfc7b8" stroke-width="0.05"/>');return;}
    o.push('<rect x="'+(b.c0/pm)+'" y="'+y+'" width="'+(b.len/pm)+'" height="'+b.h+'" fill="#d7e5d2" stroke="#cfc7b8" stroke-width="0.05"/>');
  });
  return o.join('');
}
function planTextes(geo){
  var g=M.geoInfo(geo),o=[],pm=g.plm;
  g.aires.forEach(function(b){o.push('<text x="'+(b.c0/pm+0.45)+'" y="'+(b.y+Math.min(0.85,b.h*0.3))+'" font-size="'+Math.min(0.72,b.h*0.22)+'" fill="#958a77" paint-order="stroke" stroke="#fff" stroke-width="0.1" stroke-opacity="0.75">'+esc(b.nom||'')+'</text>');});
  g.tapis.forEach(function(b){
    var x0=b.c0/pm,fz=Math.min(0.42,b.h*0.6);
    o.push('<text x="'+(x0+0.4)+'" y="'+(b.y+b.h*0.4)+'" font-size="'+fz+'" fill="#4f6b4a" paint-order="stroke" stroke="#fff" stroke-width="0.1" stroke-opacity="0.75">'+esc(b.nom||'')+'</text>');
    for(var kk=10;kk<b.len-4;kk+=10){
      var tx=x0+kk/pm;
      o.push('<line x1="'+tx+'" y1="'+(b.y+b.h*0.54)+'" x2="'+tx+'" y2="'+(b.y+b.h*0.94)+'" stroke="#a3b89f" stroke-width="0.045"/>');
      o.push('<text x="'+tx+'" y="'+(b.y+b.h*0.91)+'" font-size="'+(fz*0.86)+'" fill="#54704f" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="0.08" stroke-opacity="0.8">'+kk+'</text>');
    }
    o.push('<text x="'+(x0+b.len/pm-0.15)+'" y="'+(b.y+b.h*0.91)+'" font-size="'+(fz*0.86)+'" font-weight="700" fill="#54704f" text-anchor="end" paint-order="stroke" stroke="#fff" stroke-width="0.08" stroke-opacity="0.8">'+b.len+'</text>');
  });
  geo.bandes.forEach(function(b,ix){
    if(b.type!=='couloir')return;
    var y=0;for(var q=0;q<ix;q++)y+=geo.bandes[q].h;
    o.push('<text x="'+(g.L/2)+'" y="'+(y+b.h/2+0.3)+'" font-size="'+Math.min(0.85,b.h*0.42)+'" fill="#6f8a6b" text-anchor="middle">'+esc(b.nom||'Couloir')+'</text>');
  });
  o.push('<rect x="0" y="0" width="'+g.L+'" height="'+g.W+'" fill="none" stroke="#7a6f63" stroke-width="0.16"/>');
  return o.join('');
}

      var who=r.b==null?esc(lotShort(la)):(same?esc(lotShort(la))+' des 2 côtés':esc(lotShort(la))+' + '+esc(lotShort(lb))+' · ration commune');
      var dots='<span class="dot" style="background:'+lotCol(r.a)+'"></span>'+(r.b!=null&&!same?'<span class="dot" style="background:'+lotCol(r.b)+'"></span>':'');
      lines+='<div class="plage"><div class="ligne" style="gap:8px">'+dots+'<b>Places '+(r.k1+1)+'–'+r.k2+'</b><span class="tag">'+who+'</span></div>';
      if(!any&&!f){lines+='<div class="muet petit" style="padding:6px 0">rien à verser</div></div>';return;}
      state.feeds.forEach(function(fd){
        var d=r.d[fd.id]||0,dg=gr(d),key=t+':'+ri+':'+fd.id;
        /* en gros : la pesée à trouver (N positions, un repas) ; en petit : par place et par repas, et le jour */
        var pk=fmt(M.pesee(state,d),2),val;
        if(f&&editDose===key)val='<input class="champ num" id="doseIn" value="'+pk+'" inputmode="decimal" data-t="'+t+'" data-k1="'+r.k1+'" data-k2="'+r.k2+'" data-feed="'+fd.id+'"><span class="muet">kg</span><button class="ico" data-act="doseOk" aria-label="Valider">'+ic('check')+'</button>';
        else if(f)val='<button class="val num" data-act="dose" data-key="'+key+'">'+pk+'<small>kg</small></button>';
        else val='<span class="val num">'+pk+'<small>kg</small></span>';
        var dbl=M.estDouble(state,t);
        var det='pesée sur '+M.nPesee(state)+(dbl?' positions ('+2*M.nPesee(state)+' places)':' places')+', un repas<br>'+
          '<b class="num" style="color:var(--encre)">'+gr(M.parPlaceRepas(state,t,d))+'&nbsp;g</b> par place et par repas · '+dg+'&nbsp;g/j '+(dbl?'par position':'par place');
        var ec='';
        if(f&&r.ecartCalcul){var dv=M.doseAt(pv[t],r.k1)[fd.id]||0;if(fmt(M.pesee(state,dv),2)!==pk)ec='<div class="ecart">d’après les rations : '+fmt(M.pesee(state,dv),2)+' kg</div>';}
        lines+='<div class="dose"><span class="fn"><span class="dot" style="background:'+feedCol(fd.id)+'"></span>'+esc(fd.name)+'</span>'+val+'</div><div class="muet petit" style="margin:-4px 0 6px 22px;line-height:1.4">'+det+'</div>'+ec;
      });
      lines+='</div>';
    });
    h+='<div class="carte"><div class="ligne"><span class="nom sp">'+esc(nomTapis(t))+'</span><span class="tag num">total '+fmt(tot,1)+' kg</span></div>'+lines+'</div>';
  });
  h+='<div class="carte ligne"><span class="muet sp">À verser au total</span><span class="moyen num">'+fmt(grand,1)+' kg</span></div>';
  h+='<div class="hint">En gros : le poids à trouver à la pesée de réglage, sur '+M.nPesee(state)+' positions et pour un repas ('+M.repas(state)+' repas par jour, modifiable dans Réglages). Places numérotées depuis la gauche. La trémie verse au milieu du tapis double : une seule dose pour les 2 rangées, chaque rangée en reçoit la moitié. Impossible de séparer la ration de 2 lots face à face.</div>';
  return h;
}

/* ============ PLAN DE LA BERGERIE (éditeur) ============ */

      f+='<label>'+(b.type==='double'?'Places par côté':'Places')+'<input class="champ num" id="'+k+'len" data-act="geo" data-ix="'+ix+'" data-f="len" inputmode="numeric" value="'+b.len+'"></label>';

  h+='<div class="ligne" style="margin-top:18px"><button class="btn'+(arm==='geoDef'?' danger':'')+'" data-act="geoDef">'+ic('reset')+(arm==='geoDef'?' Confirmer : plan par défaut':' Reprendre le plan par défaut (35 × 22 m)')+'</button></div>';

function geoNom(type){var n=geoDraft.bandes.filter(function(b){return b.type===type;}).length+1;return type==='couloir'?'Couloir':TYPES_B[type]+' '+n;}
function geoAjout(type){
  var pm=geoDraft.plm,ref=0;geoDraft.bandes.forEach(function(b){if(b.len!=null)ref=Math.max(ref,b.c0+b.len);});
  var b={id:'b'+Date.now().toString(36)+Math.floor(Math.random()*1e4),type:type,nom:geoNom(type),h:type==='aire'?4:(type==='couloir'?2:0.7)};
  if(type==='aire'){b.c0=0;b.len=ref||30*pm;}
  else if(type!=='couloir'){b.c0=0;b.len=Math.max(1,Math.round((ref||30*pm)*0.9));if(type==='simple')b.cote='haut';}
  /* avant le couloir du bas s'il y en a un */
  var bb=geoDraft.bandes,last=bb[bb.length-1];
  if(type!=='couloir'&&last&&last.type==='couloir')bb.splice(bb.length-1,0,b);else bb.push(b);
}

/* ============ actions ============ */
function setNotice(m,ko){notice=m||'';noticeKo=!!ko;}
function armer(k,ms){arm=k;setTimeout(function(){if(arm===k){arm=null;render();}},ms||4000);}
function createLot(i,j){
  var id=state.nextLot++;
  state.lots.push({id:id,b:0,obj:{},name:null});
  if(i!=null&&j!=null)state.airs[i].lots[j]=id;
  editName=id;save();goVue('rations');editName=id;render();
  var n=$('nameIn');if(n)n.focus();
}
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act],[data-vue]');if(!b)return;
  if(b.hasAttribute('data-vue')){goVue(b.getAttribute('data-vue'));return;}
  var a=b.getAttribute('data-act'),lid=+b.getAttribute('data-lot'),fid=+b.getAttribute('data-feed'),l=lotById(lid);
  if(b.tagName==='INPUT')return;
  switch(a){
    case 'noticeX':setNotice('');break;
    case 'desel':sel=null;break;
    case 'assign':
      if(b.getAttribute('data-lot')==='new'){createLot(sel.i,sel.j);return;}
      state.airs[sel.i].lots[sel.j]=lid;save();break;
    case 'cut':{var sg=M.segsOf(state,sel.i)[sel.j];addBarrier(sel.i,sel.j,Math.round((sg.k1+sg.k2)/2));return;}
    case 'barL':moveBarrier(sel.i,sel.p,state.airs[sel.i].barriers[sel.p]-1);return;
    case 'barR':moveBarrier(sel.i,sel.p,state.airs[sel.i].barriers[sel.p]+1);return;
    case 'barDel':delBarrier(sel.i,sel.p);return;
    case 'b-':case 'b+':M.setEffectif(l,(l.b||0)+(a==='b+'?1:-1));save();break;
    case 'newLot':createLot();return;
    case 'pref':state.pref=b.getAttribute('data-v');save();break;
    case 'parAli':state.tol.parAliment=b.getAttribute('data-v')==='1';save();break;
    case 'versMarges':{render();var tv=$('tolV');if(tv){tv.scrollIntoView({block:'center'});tv.focus();tv.select();}return;}
    case 'rename':editName=lid;render();var n=$('nameIn');if(n){n.focus();n.select();}return;
    case 'nameOk':l.name=($('nameIn').value||'').trim()||null;editName=null;save();break;
    case 'delLot':
      if(lotStats(lid).segs.length){setNotice('Ce lot occupe encore '+lotStats(lid).segs.length+' morceau(x) d’aire : attribue-les à un autre lot dans Plan avant de le supprimer.',true);break;}
      if(arm==='lot:'+lid){arm=null;state.lots=state.lots.filter(function(x){return x.id!==lid;});if(!state.lots.length)state.lots=[{id:state.nextLot++,b:0,obj:{},name:null}];setNotice('Lot supprimé.');save();}
      else armer('lot:'+lid);
      break;
    case 'copyAll':M.applyToAll(state,l);setNotice('Ration de '+lotName(l)+' copiée sur tous les lots.');save();break;
    case 'figer':M.figer(state);setNotice('Trémies figées. Bouge tes lots : la ration reçue par brebis se lit dans Contrôle.');save();break;
    case 'recalc':
      if(arm==='recalc'){arm=null;S.copieAvant(state,'recalcul-tremies');M.liberer(state);setNotice('Doses recalculées d’après les rations voulues : règle les trémies, puis fige.');save();}
      else armer('recalc');
      break;
    case 'unique':showUnique=!showUnique;break;
    case 'print':window.print();return;
    case 'geoX':geoDraft=null;goVue('reglages');return;
    case 'geoOk':{
      if(M.verifGeo(geoDraft).length)break;
      var etaitFige=!!state.fige;
      S.copieAvant(state,'changement-plan');
      var er=M.setGeo(state,geoDraft);
      if(er.length){setNotice(er[0],true);break;}
      setNotice('Plan enregistré.'+(etaitFige?' Les trémies sont à régler de nouveau.':''));
      save();geoDraft=null;sel=null;goVue('plan');setTimeout(fitView,0);return;
    }
    case 'geoAdd':geoAjout(b.getAttribute('data-type'));break;
    case 'geoUp':case 'geoDown':{var ix=+b.getAttribute('data-ix'),j=ix+(a==='geoUp'?-1:1),bb=geoDraft.bandes;if(j<0||j>=bb.length)break;var tmp=bb[ix];bb[ix]=bb[j];bb[j]=tmp;break;}
    case 'geoDel':{var ixd=+b.getAttribute('data-ix'),kd='geo:'+ixd;if(arm===kd){arm=null;geoDraft.bandes.splice(ixd,1);}else armer(kd);break;}
    case 'geoCote':geoDraft.bandes[+b.getAttribute('data-ix')].cote=b.getAttribute('data-v');break;
    case 'geoDef':if(arm==='geoDef'){arm=null;geoDraft=M.geoDefaut();}else armer('geoDef');break;
    case 'uniqueX':showUnique=false;break;
    case 'uniqueOk':
      state.feeds.forEach(function(fd){var el=$('uni_'+fd.id);if(el&&String(el.value).trim()!=='')M.doseUnique(state,fd.id,pnum(el.value)/1000);});
      showUnique=false;setNotice('Dose appliquée à toutes les places.');save();break;
    case 'dose':editDose=b.getAttribute('data-key');render();var di=$('doseIn');if(di){di.focus();di.select();}return;
    case 'doseOk':validerDose();return;
    case 'feedRen':editFeed=fid;render();var fi=$('feedIn');if(fi){fi.focus();fi.select();}return;
    case 'feedOk':{var fo=state.feeds.find(function(x){return x.id===fid;});if(fo)fo.name=($('feedIn').value||'').trim()||fo.name;editFeed=null;save();break;}
    case 'feedDel':
      if(arm==='feed:'+fid){arm=null;M.deleteFeed(state,fid);setNotice('Aliment supprimé.');save();}
      else armer('feed:'+fid);
      break;
    case 'feedAdd':{var nn=($('newFeed').value||'').trim();if(!nn){setNotice('Écris d’abord le nom de l’aliment.');break;}M.addFeed(state,nn);save();break;}
    case 'export':exportData();break;
    case 'import':$('impFile').click();return;
    case 'copies':renderCopies();return;
    case 'restaure':{
      var cle=b.getAttribute('data-cle'),k='copie:'+cle;
      if(arm!==k){arm=k;renderCopies();setTimeout(function(){if(arm===k){arm=null;renderCopies();}},4000);return;}
      arm=null;
      S.lireCopie(cle).then(function(c2){
        if(!c2){setNotice('Copie illisible.',true);render();return;}
        S.copieAvant(state,'restauration');state=c2;sel=null;setNotice('Copie restaurée : '+state.lots.length+' lot(s).');save();render();
      });
      return;
    }
    case 'reset':
      if(arm==='reset'){arm=null;S.copieAvant(state,'remise-a-zero');state=M.defaultState();sel=null;setNotice('Tout est effacé. Une copie a été gardée (Copies automatiques).');save();}
      else armer('reset');
      break;
  }
  render();
});
function validerDose(){
  var di=$('doseIn');if(!di)return;
  /* saisie = le poids pesé (kg sur N positions, un repas) */
  M.setDosePlage(state,+di.getAttribute('data-t'),+di.getAttribute('data-k1'),+di.getAttribute('data-k2'),+di.getAttribute('data-feed'),M.depuisPesee(state,pnum(di.value)));
  editDose=null;save();render();
}
document.addEventListener('input',function(e){
  var el=e.target,a=el.getAttribute('data-act');if(!a)return;
  var l=lotById(+el.getAttribute('data-lot'));
  if(a==='eff'){if(String(el.value).trim()==='')return;M.setEffectif(l,pnum(el.value));}
  else if(a==='ration'){var f=+el.getAttribute('data-feed'),v=pnum(el.value);if(state.pref==='kg')M.setVoulueKg(l,f,v);else M.setVoulue(l,f,v/1000);}
  else if(a==='geo'){
    var fld=el.getAttribute('data-f'),gx=+el.getAttribute('data-ix'),pmo=geoDraft.plm;
    if(fld==='plm'){
      var np=Math.round(pnum(el.value));if(!(np>=1&&np<=10)||np===pmo)return;
      geoDraft.bandes.forEach(function(bb){if(bb.len!=null){bb.c0=Math.round(bb.c0*np/pmo);bb.len=Math.max(1,Math.round(bb.len*np/pmo));}});
      geoDraft.plm=np;
    }else{
      var bd=geoDraft.bandes[gx];
      if(fld==='nom')bd.nom=el.value;
      else if(fld==='c0m')bd.c0=Math.max(0,Math.round(pnum(el.value)*pmo));
      else if(fld==='lenm')bd.len=Math.round(pnum(el.value)*pmo);
      else if(fld==='len')bd.len=Math.round(pnum(el.value));
      else if(fld==='h')bd.h=Math.round(pnum(el.value)*100)/100;
    }
    render();return;
  }
  else if(a==='distrib'){
    var rp=Math.round(pnum($('repasIn').value)),np=Math.round(pnum($('peseeIn').value));
    if(!(rp>=1&&rp<=10&&np>=1&&np<=200))return;
    state.distrib={repas:rp,pesee:np};
  }
  else if(a==='tol'){
    var tv=Math.round(pnum($('tolV').value)*10)/10,to=Math.round(pnum($('tolO').value)*10)/10;
    if(!(tv>0&&to>tv&&to<=100))return;  /* attendre une saisie cohérente (vert < orange) */
    state.tol.vert=tv;state.tol.orange=to;
  }
  else return;
  save();render();
});

/* ============ barrières ============ */
function insertBarrier(i,k){
  var a=state.airs[i],p=0;
  while(p<a.barriers.length&&a.barriers[p]<k)p++;
  var ga=GI().aires[i],lo=p===0?ga.c0+1:a.barriers[p-1]+1,hi=p===a.barriers.length?ga.c0+ga.len-1:a.barriers[p]-1;
  if(lo>hi)return -1;
  k=Math.max(lo,Math.min(hi,k));
  a.barriers.splice(p,0,k);a.lots.splice(p+1,0,a.lots[p]);
  return p;
}
function addBarrier(i,j,k){
  var a=state.airs[i],ga=GI().aires[i],lo=j===0?ga.c0+1:a.barriers[j-1]+1,hi=j===a.barriers.length?ga.c0+ga.len-1:a.barriers[j]-1;
  if(lo>hi){setNotice('Plus de place dans ce morceau.');render();return;}
  k=Math.max(lo,Math.min(hi,k));
  a.barriers.splice(j,0,k);a.lots.splice(j+1,0,a.lots[j]);
  sel={t:'bar',i:i,p:j};save();render();
}
function clampBar(i,p,k){var a=state.airs[i],ga=GI().aires[i],lo=p===0?ga.c0+1:a.barriers[p-1]+1,hi=p===a.barriers.length-1?ga.c0+ga.len-1:a.barriers[p+1]-1;return Math.max(lo,Math.min(hi,k));}
function moveBarrier(i,p,k){k=clampBar(i,p,k);if(k===state.airs[i].barriers[p])return;state.airs[i].barriers[p]=k;save();render();}
function moveBarrierLive(i,p,k){k=clampBar(i,p,k);if(k===state.airs[i].barriers[p])return;state.airs[i].barriers[p]=k;save();renderMap();}
function delBarrier(i,p){var a=state.airs[i];a.barriers.splice(p,1);a.lots.splice(p,2,a.lots[p]);sel=null;save();render();}
function kFromX(x){return Math.round(x*GI().plm);}

/* ============ gestes sur le plan ============ */
function toSvg(cx,cy){var r=svg.getBoundingClientRect();return {x:view.x+((cx-r.left)/r.width)*view.w,y:view.y+((cy-r.top)/r.height)*view.h};}
function aireAt(y){var as=GI().aires;for(var i=0;i<as.length;i++){if(y>=as[i].y-0.15&&y<=as[i].y+as[i].h+0.15)return i;}return -1;}
function hitBarrier(p){
  var ai=aireAt(p.y);if(ai<0)return null;
  var tol=16/svg.getBoundingClientRect().width*view.w,bp=-1,bd=1e9;
  state.airs[ai].barriers.forEach(function(k,ix){var d=Math.abs(p.x-X(k));if(d<tol&&d<bd){bd=d;bp=ix;}});
  return bp<0?null:{i:ai,p:bp};
}
function segAt(p){
  var ai=aireAt(p.y);
  if(ai<0)return null;
  var kF=p.x*GI().plm,ks=M.ksOf(state,ai);
  if(kF<ks[0]-0.6||kF>ks[ks.length-1]+0.6)return null;
  for(var j=0;j<ks.length-1;j++)if(kF>=ks[j]-1e-9&&kF<=ks[j+1]+1e-9)return {i:ai,j:j};
  return null;
}
var ptrs={},gest={mode:null,bar:null,moved:0,pc:null,pinch:null,timer:null,longOk:false,pDown:null};
function nPtrs(){return Object.keys(ptrs).length;}
function pinchInfo(){var a=[];for(var id in ptrs)a.push(ptrs[id]);return {cx:(a[0].x+a[1].x)/2,cy:(a[0].y+a[1].y)/2,d:Math.max(1,Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y))};}
function clearTimer(){if(gest.timer){clearTimeout(gest.timer);gest.timer=null;}}
svg.addEventListener('contextmenu',function(e){e.preventDefault();});
svg.addEventListener('pointerdown',function(e){
  e.preventDefault();
  try{svg.setPointerCapture(e.pointerId);}catch(err){}
  ptrs[e.pointerId]={x:e.clientX,y:e.clientY};
  if(nPtrs()===1){
    gest.moved=0;gest.pc={x:e.clientX,y:e.clientY};gest.longOk=false;
    var p=toSvg(e.clientX,e.clientY);gest.pDown=p;
    var bI=hitBarrier(p);
    if(bI){gest.mode='bar';gest.bar=bI;sel={t:'bar',i:bI.i,p:bI.p};renderMap();}
    else{
      gest.mode='pan';
      gest.timer=setTimeout(function(){
        if(gest.mode==='pan'&&gest.moved<10&&nPtrs()===1){
          var sg=segAt(gest.pDown);
          if(sg){var p2=insertBarrier(sg.i,kFromX(gest.pDown.x));if(p2>=0){save();sel={t:'bar',i:sg.i,p:p2};gest.longOk=true;render();}}
        }
      },600);
    }
  }else{clearTimer();gest.mode='pinch';gest.bar=null;gest.pinch=pinchInfo();}
});
svg.addEventListener('pointermove',function(e){
  if(!(e.pointerId in ptrs))return;
  ptrs[e.pointerId]={x:e.clientX,y:e.clientY};
  if(nPtrs()>=2){
    if(gest.mode!=='pinch'){clearTimer();gest.mode='pinch';gest.bar=null;gest.pinch=pinchInfo();return;}
    var pi=pinchInfo();
    if(gest.pinch){
      zoomAt(gest.pinch.cx,gest.pinch.cy,gest.pinch.d/pi.d);
      var r=svg.getBoundingClientRect();
      view.x-=(pi.cx-gest.pinch.cx)/r.width*view.w;view.y-=(pi.cy-gest.pinch.cy)/r.height*view.h;clampView();setVB();
    }
    gest.pinch=pi;return;
  }
  gest.moved=Math.max(gest.moved,Math.abs(e.clientX-gest.pc.x),Math.abs(e.clientY-gest.pc.y));
  if(gest.moved>=10)clearTimer();
  if(gest.mode==='bar'&&gest.bar){var p=toSvg(e.clientX,e.clientY);moveBarrierLive(gest.bar.i,gest.bar.p,kFromX(p.x));}
  else if(gest.mode==='pan'){
    var rr=svg.getBoundingClientRect();
    view.x-=(e.clientX-gest.pc.x)/rr.width*view.w;view.y-=(e.clientY-gest.pc.y)/rr.height*view.h;clampView();setVB();
    gest.pc={x:e.clientX,y:e.clientY};
  }
});
function endPtr(e){
  if(!(e.pointerId in ptrs))return;
  delete ptrs[e.pointerId];
  if(nPtrs()===1){clearTimer();for(var id in ptrs){gest.pc={x:ptrs[id].x,y:ptrs[id].y};break;}gest.mode='pan';gest.bar=null;gest.pinch=null;return;}
  if(nPtrs()===0){
    clearTimer();
    if(gest.mode==='bar'){render();}
    else if(gest.mode==='pan'&&!gest.longOk&&gest.moved<10){
      var p=toSvg(e.clientX,e.clientY),bI=hitBarrier(p);
      if(bI)sel={t:'bar',i:bI.i,p:bI.p};
      else{var sg=segAt(p);sel=sg?{t:'seg',i:sg.i,j:sg.j}:null;}
      arm=null;render();
    }
    gest.mode=null;gest.bar=null;gest.pinch=null;gest.longOk=false;
  }
}
svg.addEventListener('pointerup',endPtr);
svg.addEventListener('pointercancel',endPtr);
svg.addEventListener('wheel',function(e){e.preventDefault();zoomAt(e.clientX,e.clientY,e.deltaY>0?1.15:0.87);},{passive:false});
$('zin').innerHTML=ic('zin',20);$('zout').innerHTML=ic('zout',20);$('zfit').innerHTML=ic('fit',20);
